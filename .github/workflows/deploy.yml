name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages.
# Requirement: in the repo Settings, under Pages, set Source to "GitHub Actions".
on:
  push:
    # Deploys whenever the site changes on these branches. Add or change to
    # "main" once that becomes your default branch.
    branches:
      - claude/vibrant-meitner-j1ynb9
      - main
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, do not cancel an in progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
